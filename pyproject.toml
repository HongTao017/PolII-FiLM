[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfnet"
version = "1.2.0"
description = "Reproducible four-region DNA and biochemical FiLM model for human Pol II pausing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
model = ["torch>=2.6,<3"]
genomics = ["pyfaidx>=0.8"]
figures = ["matplotlib==3.10.9", "PyMuPDF==1.28.2", "h5py==3.16.0", "Pillow>=11"]

[project.scripts]
pfnet = "pfnet.cli:main"

[tool.setuptools]
packages = ["pfnet", "polii_film"]
